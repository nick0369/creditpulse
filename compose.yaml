services:
  api:
    build: .
    ports: ["8000:8000"]
    volumes: ["audit:/app/state"]
    environment:
      AUDIT_DB: /app/state/audit.db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  audit:
