name: Verify model project
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests-and-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Build container
        run: docker build -t model-project:test .
      - name: Smoke test container
        run: |
          docker run -d --name model-api -p 8000:8000 model-project:test
          for i in $(seq 1 20); do
            if curl --fail http://localhost:8000/ready; then exit 0; fi
            sleep 2
          done
          docker logs model-api
          exit 1
